{% extends "sqladmin/base.html" %}
{% block body %}
<main class="container py-5">
  <h1>Sign out of Visdom?</h1>
  <form method="post" action="/api/v1/auth/logout?return_to_login=true">
    <button type="submit" class="btn btn-primary">Sign out</button>
    <a href="{{ url_for('admin:index') }}" class="btn">Cancel</a>
  </form>
</main>
{% endblock %}
