# Full visdom-dev stack. Every credential, port, and URL is supplied from the
# environment (copy .env.docker.example to .env and edit that one file) — nothing
# is hardcoded here, so swapping config is a single-file change.

name: visdom-dev

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-visdom: &visdom
  build:
    context: ${VISDOM_CONTEXT}
  image: visdom-dev-visdom:local
  restart: unless-stopped
  logging: *logging
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  environment:
    VISDOM_PORT: ${VISDOM_PORT}
    VISDOM_BASE_URL: ${VISDOM_BASE_URL}
    VISDOM_ENV_PATH: ${VISDOM_ENV_PATH}
    VISDOM_GATEWAY_URL: http://gateway:${GATEWAY_PORT}
  volumes:
    - visdom_data:${VISDOM_ENV_PATH}
  depends_on:
    - gateway

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: ${GATEWAY_PORT}
      GATEWAY_WORKERS: ${GATEWAY_WORKERS:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    depends_on:
      db:
        condition: service_healthy

  visdom-1:
    <<: *visdom
  visdom-2:
    <<: *visdom
  visdom-3:
    <<: *visdom

  proxy:
    build:
      context: .
      dockerfile: deploy/proxy.Dockerfile
    restart: unless-stopped
    logging: *logging
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      NGINX_PORT: ${NGINX_PORT}
      GATEWAY_HOST: gateway
      GATEWAY_PORT: ${GATEWAY_PORT}
      VISDOM_SERVERS: ${VISDOM_SERVERS}
    ports:
      - "${PUBLIC_PORT}:${NGINX_PORT}"
    depends_on:
      - gateway
      - visdom-1
      - visdom-2
      - visdom-3

  bench:
    profiles: ["bench"]
    build:
      context: ./bench
    environment:
      BENCH_SERVER: http://proxy
      BENCH_PORT: ${NGINX_PORT}
      BENCH_BASE_URL: ${VISDOM_BASE_URL}
      VISDOM_API_KEY: ${VISDOM_API_KEY:-}
      BENCH_EMAIL: ${BENCH_EMAIL:-}
      BENCH_PASSWORD: ${BENCH_PASSWORD:-}
    depends_on:
      - proxy

  k6:
    profiles: ["bench"]
    image: grafana/k6:latest
    entrypoint: ["k6"]
    working_dir: /scripts
    volumes:
      - ./bench/k6:/scripts:ro
    environment:
      BENCH_BASE: http://proxy:${NGINX_PORT}
      BENCH_USERS: ${BENCH_USERS:-}
      BENCH_RATES: ${BENCH_RATES:-}
      BENCH_STAGE: ${BENCH_STAGE:-}
      BENCH_WORKSPACE: ${BENCH_WORKSPACE:-}
    depends_on:
      - proxy

volumes:
  db_data:
  visdom_data:
