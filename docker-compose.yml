# Full visdom-dev stack. Every credential, port, and URL is supplied from the
# environment (copy .env.docker.example to .env and edit that one file) — nothing
# is hardcoded here, so swapping config is a single-file change.

name: visdom-dev

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-visdom: &visdom
  build:
    context: ${VISDOM_CONTEXT}
  image: visdom-dev-visdom:local
  restart: unless-stopped
  logging: *logging
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  environment:
    VISDOM_PORT: ${VISDOM_PORT}
    VISDOM_BASE_URL: ${VISDOM_BASE_URL}
    VISDOM_ENV_PATH: ${VISDOM_ENV_PATH}
    VISDOM_GATEWAY_URL: http://gateway:${GATEWAY_PORT}
    VISDOM_PROXY_URL: http://proxy:${NGINX_PORT}
    VISDOM_OWNERSHIP_INTERVAL: ${VISDOM_OWNERSHIP_INTERVAL:-30}
    VISDOM_INTERNAL_READ_KEYS: ${VISDOM_INTERNAL_READ_KEY:?set VISDOM_INTERNAL_READ_KEY in .env},${VISDOM_INTERNAL_READ_KEY_PREVIOUS:-}
    VISDOM_INTERNAL_ADMIN_KEYS: ${VISDOM_INTERNAL_ADMIN_KEY:?set VISDOM_INTERNAL_ADMIN_KEY in .env},${VISDOM_INTERNAL_ADMIN_KEY_PREVIOUS:-}
  entrypoint: ["python", "-m", "visdom.server"]
  command:
    - -port
    - ${VISDOM_PORT}
    - -base_url
    - ${VISDOM_BASE_URL}
    - -env_path
    - ${VISDOM_ENV_PATH}
    - -internal_port
    - ${VISDOM_INTERNAL_PORT}
    - -internal_ssl_certfile
    - /internal-tls/internal.crt
    - -internal_ssl_keyfile
    - /internal-tls/internal.key
  volumes:
    - visdom_data:${VISDOM_ENV_PATH}
    - type: bind
      source: ./deploy/internal-tls/internal.crt
      target: /internal-tls/internal.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./deploy/internal-tls/internal.key
      target: /internal-tls/internal.key
      read_only: true
      bind:
        create_host_path: false
  depends_on:
    - gateway

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      FRONTEND_URL: ${FRONTEND_URL}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Visdom}
      PORT: ${GATEWAY_PORT}
      GATEWAY_WORKERS: ${GATEWAY_WORKERS:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-False}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      VISDOM_SERVERS: ${VISDOM_SERVERS}
      VISDOM_INTERNAL_PORT: ${VISDOM_INTERNAL_PORT}
      VISDOM_INTERNAL_READ_KEY: ${VISDOM_INTERNAL_READ_KEY:?set VISDOM_INTERNAL_READ_KEY in .env}
      VISDOM_INTERNAL_ADMIN_KEY: ${VISDOM_INTERNAL_ADMIN_KEY:?set VISDOM_INTERNAL_ADMIN_KEY in .env}
      RETENTION_SWEEP_HOURS: ${RETENTION_SWEEP_HOURS:-24}
      ACCOUNT_DELETION_HOURS: ${ACCOUNT_DELETION_HOURS:-6}
      RETENTION_ENFORCE: ${RETENTION_ENFORCE:-False}
      RETENTION_STARTS: ${RETENTION_STARTS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      VISDOM_INTERNAL_CA: /internal-tls/internal-ca.pem
      ADMIN_ENVIRONMENT: ${ADMIN_ENVIRONMENT:-}
    volumes:
      - type: bind
        source: ./deploy/internal-tls/internal-ca.pem
        target: /internal-tls/internal-ca.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

  visdom-1:
    <<: *visdom
  visdom-2:
    <<: *visdom
  visdom-3:
    <<: *visdom

  proxy:
    build:
      context: .
      dockerfile: deploy/proxy.Dockerfile
    restart: unless-stopped
    logging: *logging
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      NGINX_PORT: ${NGINX_PORT}
      GATEWAY_HOST: gateway
      GATEWAY_PORT: ${GATEWAY_PORT}
      VISDOM_SERVERS: ${VISDOM_SERVERS}
    ports:
      - "${PUBLIC_PORT}:${NGINX_PORT}"
    depends_on:
      - gateway
      - visdom-1
      - visdom-2
      - visdom-3

  bench:
    profiles: ["bench"]
    build:
      context: ./bench
    environment:
      BENCH_SERVER: http://proxy
      BENCH_PORT: ${NGINX_PORT}
      BENCH_BASE_URL: ${VISDOM_BASE_URL}
      VISDOM_API_KEY: ${VISDOM_API_KEY:-}
      BENCH_EMAIL: ${BENCH_EMAIL:-}
      BENCH_PASSWORD: ${BENCH_PASSWORD:-}
    depends_on:
      - proxy

  k6:
    profiles: ["bench"]
    image: grafana/k6:latest
    entrypoint: ["k6"]
    working_dir: /scripts
    volumes:
      - ./bench/k6:/scripts:ro
    environment:
      BENCH_BASE: http://proxy:${NGINX_PORT}
      BENCH_USERS: ${BENCH_USERS:-}
      BENCH_RATES: ${BENCH_RATES:-}
      BENCH_STAGE: ${BENCH_STAGE:-}
      BENCH_WORKSPACE: ${BENCH_WORKSPACE:-}
    depends_on:
      - proxy

volumes:
  db_data:
  visdom_data:
